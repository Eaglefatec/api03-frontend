<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUSEX - Acesso ao Sistema</title>
<link rel="stylesheet" href="css/fusex-theme.css">
<style>
  .login-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .login-card { max-width: 400px; width: 100%; }
  .login-header { text-align: center; margin-bottom: 24px; }
</style>
</head>
<body>
<div class="login-wrapper">
  <div class="card login-card">
    <div class="login-header">
      <div style="margin-bottom: 12px;">
        <span class="brand-logo" style="font-size: 0.9em; padding: 7px 16px;">FUSEX</span>
      </div>
      <h1 class="card-title" style="font-size: 1.3em;">Acesso ao Sistema</h1>
      <p class="card-subtitle" style="margin-bottom: 0;">Entre com seu e-mail e senha. Você será levado direto à tela do seu perfil.</p>
    </div>

    <form id="loginForm">
      <label for="email">E-mail</label>
      <input type="text" id="email" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="seu.email@gmail.com" required autofocus autocomplete="username">

      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="Digite sua senha" required autocomplete="current-password">

      <button type="submit" class="btn btn-primary" id="loginBtn">Entrar</button>
    </form>

    <div id="errorMsg" class="alert alert-error" hidden></div>
  </div>
</div>

<script src="js/fusex-auth.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('errorMsg');
  const loginBtn = document.getElementById('loginBtn');

  FusexAuth.clear();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.hidden = true;

    const email = document.getElementById('email').value.trim().toLowerCase();
    const senha = document.getElementById('password').value;
    if (!email || !senha) {
      errorBox.textContent = 'Informe o e-mail e a senha.';
      errorBox.hidden = false;
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = 'Autenticando...';
    try {
      const { destino } = await FusexAuth.login(email, senha);
      const next = FusexAuth.nextSeguro(new URLSearchParams(location.search).get('next'));
      // Se a página de destino não pertencer ao perfil do usuário, ele será redirecionado para sua tela inicial
      location.replace(next || destino);
    } catch (err) {
      errorBox.textContent = err.message || 'Erro ao processar login.';
      errorBox.hidden = false;
      loginBtn.disabled = false;
      loginBtn.textContent = 'Entrar';
    }
  });
</script>
</body>
</html>
